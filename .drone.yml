---
kind: pipeline
type: kubernetes
name: staging-combined

trigger:
  branch:
    - staging

steps:
  # Step 1: Build and publish backend Docker image
  - name: publish-backend
    image: plugins/kaniko-ecr
    settings:
      create_repository: true
      registry: 795250896452.dkr.ecr.us-east-1.amazonaws.com
      repo: industrysolutions/retail-ap2-assistant-backend
      dockerfile: Dockerfile.backend
      context: .
      tags:
        - git-${DRONE_COMMIT_SHA:0:7}
        - latest
      access_key:
        from_secret: ecr_access_key
      secret_key:
        from_secret: ecr_secret_key
    when:
      event:
        - push

  # Step 2: Deploy backend sidecar to Kubernetes
  - name: deploy-backend-staging
    image: public.ecr.aws/kanopy/drone-helm:v3
    settings:
      chart: mongodb/web-app
      chart_version: "4.30.0"
      add_repos: [mongodb=https://10gen.github.io/helm-charts]
      namespace: industrysolutions
      release: retail-ap2-assistant-backend
      values_files: ["environment/staging.yaml"]
      values:
        - "sidecarContainers[0].image=795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/retail-ap2-assistant-backend:git-${DRONE_COMMIT_SHA:0:7}"
        - "image.tag=alpine"
        - "image.repository=nginx"
        - "ingress.enabled=true"
        - "ingress.hosts[0]=retail-ap2-assistant-backend.industrysolutions.staging.corp.mongodb.com"
        - "mesh.enabled=true"
        # Service configuration to route to backend sidecar port 8080
        - "service.port=8080"
        - "service.targetPort=8080"
        - "service.name=backend"
        # Frontend resources (nginx minimal)
        - "resources.limits.cpu=100m"
        - "resources.limits.memory=128Mi"
        - "resources.requests.cpu=50m"
        - "resources.requests.memory=64Mi"
        # Backend sidecar resources (increased for AI workload)
        - "sidecarContainers[0].resources.limits.cpu=500m"
        - "sidecarContainers[0].resources.limits.memory=1Gi"
        - "sidecarContainers[0].resources.requests.cpu=150m"
        - "sidecarContainers[0].resources.requests.memory=512Mi"
      api_server: https://api.staging.corp.mongodb.com
      kubernetes_token:
        from_secret: staging_kubernetes_token
    when:
      branch:
        - staging
      event:
        - push

---
kind: pipeline
type: kubernetes
name: production-combined

trigger:
  branch:
    - main
  event:
    - push

steps:
  # Step 1: Build and publish backend Docker image
  - name: publish-backend-prod
    image: plugins/kaniko-ecr
    settings:
      create_repository: true
      registry: 795250896452.dkr.ecr.us-east-1.amazonaws.com
      repo: industrysolutions/retail-ap2-assistant-backend-prod
      dockerfile: Dockerfile.backend
      context: .
      tags:
        - git-${DRONE_COMMIT_SHA:0:7}
        - latest
      access_key:
        from_secret: ecr_access_key
      secret_key:
        from_secret: ecr_secret_key
    when:
      event:
        - push

  # Step 2: Deploy backend sidecar to production
  - name: deploy-backend-prod
    image: public.ecr.aws/kanopy/drone-helm:v3
    settings:
      chart: mongodb/web-app
      chart_version: "4.30.0"
      add_repos: [mongodb=https://10gen.github.io/helm-charts]
      namespace: industrysolutions
      release: retail-ap2-assistant-backend-prod
      values_files: ["environment/production.yaml"]
      values:
        - "sidecarContainers[0].image=795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/retail-ap2-assistant-backend-prod:git-${DRONE_COMMIT_SHA:0:7}"
        - "image.tag=git-${DRONE_COMMIT_SHA:0:7}"
        - "image.repository=nginx:alpine"
        - "ingress.enabled=true"
        - "ingress.hosts[0]=retail-ap2-assistant-backend.industrysolutions.prod.corp.mongodb.com"
        - "mesh.enabled=true"
        # Service configuration to route to backend sidecar port 8080
        - "service.port=8080"
        - "service.targetPort=8080"
        - "service.name=backend"
        # Frontend resources (nginx minimal)
        - "resources.limits.cpu=100m"
        - "resources.limits.memory=128Mi"
        - "resources.requests.cpu=50m"
        - "resources.requests.memory=64Mi"
        # Backend sidecar resources (production - higher for reliability)
        - "sidecarContainers[0].resources.limits.cpu=1000m"
        - "sidecarContainers[0].resources.limits.memory=1Gi"
        - "sidecarContainers[0].resources.requests.cpu=250m"
        - "sidecarContainers[0].resources.requests.memory=512Mi"
      api_server: https://api.prod.corp.mongodb.com
      kubernetes_token:
        from_secret: prod_kubernetes_token
    when:
      branch:
        - main
      event:
        - push