env:
  NODE_ENV: staging
  # AWS region for IRSA (no credentials needed)
  AWS_REGION: us-east-1
  #COLLECTION_NAME: test-collection
  GOOGLE_APPLICATION_CREDENTIALS: /etc/gcp/credential-configuration.json
  GCP_PROJECT_ID: ist-retail-demo
  GCP_LOCATION: us-central1
  
## Single Pod Containers
envSecrets:
  # Workflow Configuration
  WORKFLOW_PROVIDER: retail-ap2-assistant
  WORKFLOW_DIR: retail-ap2-assistant
  # LLM Configuration
  LLM_PROVIDER: retail-ap2-assistant
  GOOGLE_MODEL_ID: retail-ap2-assistant
  # Google Cloud Configuration
  GOOGLE_GENAI_USE_VERTEXAI: retail-ap2-assistant
  GOOGLE_CLOUD_PROJECT: retail-ap2-assistant
  GOOGLE_CLOUD_LOCATION: retail-ap2-assistant  # MongoDB Configuration
  MDB_URI: retail-ap2-assistant
  MDB_DATABASE_NAME: retail-ap2-assistant
  MDB_COLLECTION_NAME: retail-ap2-assistant

## ----------------------------- Cloud Specific Configurations -----------------------------

## Backend Sidecar Container (AI Workload)
sidecarContainers:
  - name: backend
    # Image will be overridden by Drone pipeline with specific git-SHA tag
    image: 795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/retail-ap2-assistant-backend:latest
    
    # Expose backend port (accessible via localhost from main container)
    ports:
      - containerPort: 8080
        name: backend
    
    # Environment variables for backend container
    env:
      - name: NODE_ENV
        value: staging

      - name: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/gcp/credential-configuration.json

      - name: WORKFLOW_PROVIDER
        valueFrom:
          secretKeyRef:
            name: retail-ap2-assistant
            key: WORKFLOW_PROVIDER

      - name: WORKFLOW_DIR
        valueFrom:
          secretKeyRef:
            name: retail-ap2-assistant
            key: WORKFLOW_DIR

      - name: LLM_PROVIDER
        valueFrom:
          secretKeyRef:
            name: retail-ap2-assistant
            key: LLM_PROVIDER

      - name: GOOGLE_MODEL_ID
        valueFrom:
          secretKeyRef:
            name: retail-ap2-assistant
            key: GOOGLE_MODEL_ID

      - name: GOOGLE_GENAI_USE_VERTEXAI
        valueFrom:
          secretKeyRef:
            name: retail-ap2-assistant
            key: GOOGLE_GENAI_USE_VERTEXAI

      - name: GOOGLE_CLOUD_PROJECT
        valueFrom:
          secretKeyRef:
            name: retail-ap2-assistant
            key: GOOGLE_CLOUD_PROJECT

      - name: GOOGLE_CLOUD_LOCATION
        valueFrom:
          secretKeyRef:
            name: retail-ap2-assistant
            key: GOOGLE_CLOUD_LOCATION

      - name: MDB_URI
        valueFrom:
          secretKeyRef:
            name: retail-ap2-assistant
            key: MDB_URI

      - name: MDB_DATABASE_NAME
        valueFrom:
          secretKeyRef:
            name: retail-ap2-assistant
            key: MDB_DATABASE_NAME

      - name: MDB_COLLECTION_NAME
        valueFrom:
          secretKeyRef:
            name: retail-ap2-assistant
            key: MDB_COLLECTION_NAME
    
    volumeMounts:
      - name: gcp-creds
        mountPath: /etc/gcp
        readOnly: true
      - name: gcp-token
        mountPath: /var/run/service-account
        readOnly: true

# GCP Workload Identity Federation configuration
serviceAccount:
  enabled: true

# Mount GCP credential config AND projected service account token
extraVolumes:
  - name: gcp-creds
    configMap:
      name: gcp-wif-config-retail
  - name: gcp-token
    projected:
      sources:
        - serviceAccountToken:
            path: token
            expirationSeconds: 3600  # Token expires after 1 hour and auto-renews
            audience: "//iam.googleapis.com/projects/531154772515/locations/global/workloadIdentityPools/kanopy-retail-wif-pool/providers/kanopy-retail-provider"

# Kanopy security and ownership (requires web-app chart v4.30.0+)
security:
  dataClassification: "Internal"
  dataDesignation: ["MI"]

ownership:
  driEmail: angie.guemes@mongodb.com